<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동아리 매니저</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header with tab bar, one view at a time; summary tiles first, then lists/tables. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#16202a; --muted:#5b6876; --line:#dce2e8;
  --accent:#0b7568; --accent-ink:#ffffff; --accent-soft:#e2f2ef;
  --ok:#1d7f46; --ok-soft:#e3f4ea; --warn:#a86a12; --warn-soft:#fbf0dc; --bad:#bf3a33; --bad-soft:#fbe7e5;
  --font-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171d; --surface:#192129; --ink:#e6ecf1; --muted:#97a5b2; --line:#2a353f;
  --accent:#3fb7a6; --accent-ink:#06201c; --accent-soft:#163631;
  --ok:#5cc98a; --ok-soft:#173526; --warn:#e2a64c; --warn-soft:#3a2c14; --bad:#f07a72; --bad-soft:#3d1d1b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11171d; --surface:#192129; --ink:#e6ecf1; --muted:#97a5b2; --line:#2a353f;
  --accent:#3fb7a6; --accent-ink:#06201c; --accent-soft:#163631;
  --ok:#5cc98a; --ok-soft:#173526; --warn:#e2a64c; --warn-soft:#3a2c14; --bad:#f07a72; --bad-soft:#3d1d1b; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:6px}
.brand{font-family:var(--font-display);font-size:24px;letter-spacing:.5px;line-height:1.2}
.term{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.spacer{flex:1}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-color:var(--accent)}
nav.tabs a:hover{color:var(--ink)}
main{padding-top:22px;padding-bottom:60px}
.view{display:none;flex-direction:column;gap:18px}
.view.on{display:flex}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head h2{font-size:20px}
.head .spacer{min-width:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:13px;font-weight:500}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--bg)}
.btn.danger:hover{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{display:flex;flex-direction:column;gap:4px}
.tile .lab{font-size:13px;color:var(--muted);font-weight:500}
.tile .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .sub{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{display:flex;flex-direction:column;gap:6px}
.notice.pinned{border-left:4px solid var(--accent)}
.notice h3{font-size:17px}
.notice .body{white-space:pre-wrap;overflow-wrap:anywhere}
.row-actions{display:flex;gap:4px;flex-wrap:wrap}
.ev{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center}
.date{border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 0;background:var(--bg)}
.date .m{font-size:11px;color:var(--muted);font-weight:600}
.date .d{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.date .w{font-size:11px;color:var(--muted)}
.ev.past .date{opacity:.65}
.ev h3{font-size:16px}
.ev-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.att{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;margin-top:2px;display:flex;flex-direction:column;gap:6px}
.att-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.att-row .nm{min-width:96px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 11px;font-size:13px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:disabled{cursor:default}
.seg button.on.present{background:var(--ok);color:#fff}
.seg button.on.late{background:var(--warn);color:#fff}
.seg button.on.absent{background:var(--bad);color:#fff}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;min-width:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.progress{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.paygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pay{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);cursor:pointer;text-align:left}
.pay.paid{border-color:var(--ok);background:var(--ok-soft)}
.pay:disabled{cursor:default}
.in{color:var(--ok)} .out{color:var(--bad)}
.banner{display:none;margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}
.banner.on{display:block}
body.ro .w,body.noadm .wa{display:none!important}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.yn button{border:0;background:var(--surface);padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;border-right:1px solid var(--line)}
.yn button:last-child{border-right:0}
.yn button.on.y{background:var(--ok);color:#fff}
.yn button.on.n{background:var(--bad);color:#fff}
.yn button:disabled{cursor:default}
.amt{width:120px;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(10,15,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:20;overflow:auto}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:460px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h3{font-size:18px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld textarea{min-height:120px;resize:vertical}
.fld .inp{width:100%}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.sec-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
@media (max-width:820px){.tiles{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:420px){.wrap{padding:0 16px}.tile .big{font-size:22px}.ev{grid-template-columns:54px 1fr}.ev>.row-actions{grid-column:2}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand" id="clubName">우리 동아리</div>
      <span class="term" id="termLabel">2026-2학기</span>
      <span class="spacer"></span>
      <button class="btn ghost wa" data-act="settings" id="btn-settings">동아리 설정</button>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#home" data-tab="home">홈</a>
      <a href="#notices" data-tab="notices">공지사항</a>
      <a href="#events" data-tab="events">일정·출석</a>
      <a href="#members" data-tab="members">회원 명단</a>
      <a href="#fees" data-tab="fees">회비</a>
    </nav>
  </div>
</header>
<div class="wrap"><div class="banner" id="banner"></div></div>
<main class="wrap">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-notices"></section>
  <section class="view" id="v-events"></section>
  <section class="view" id="v-members"></section>
  <section class="view" id="v-fees"></section>
</main>
<div class="modal" id="modal" hidden><form class="sheet" id="mform" novalidate></form></div>
<div class="toast" id="toast" role="status"></div>

<script>
const ROLES=["회장","부회장","총무","운영진","회원","휴면"];
const NCATS=["일반","중요","행사","모집"];
const S={info:{name:"우리 동아리",term:"2026-2학기",fee:30000},notices:[],events:[],members:[],ledger:[],
  fees:{},canWrite:true,canFee:true,mode:"loading",me:null,names:{},openEvent:null,mq:"",mrole:"전체",tab:"home"};
let api=null,userCap=null,wroteOk=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>(Number(n)||0).toLocaleString("ko-KR")+"원";
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const parseD=s=>{const d=new Date((s||"")+"T00:00");return isNaN(d)?new Date():d};
const WD=["일","월","화","수","목","금","토"];
const fmtD=s=>{const d=parseD(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`};
const dday=s=>{const n=Math.round((parseD(s)-parseD(today()))/864e5);return n===0?"오늘":n>0?`D-${n}`:`${-n}일 전`};
const termKey=()=>(S.info.term||"").replace(/[^A-Za-z0-9_-]/g,"")||"term";
const activeMembers=()=>S.members.filter(m=>m.role!=="휴면");
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"","ko");
const roleOrder=r=>{const i=ROLES.indexOf(r);return i<0?99:i};

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600)}
function banner(msg){const b=$("#banner");b.textContent=msg||"";b.classList.toggle("on",!!msg)}

/* ---------- data layer ---------- */
function realApi(db){
  const q={};
  const run=(p,fn)=>(q[p]=(q[p]||Promise.resolve()).catch(()=>{}).then(fn));
  return{
    sub:(c,cb,err)=>db.collection(c).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()})),s.metadata),err),
    subDoc:(p,cb,err)=>db.doc(p).onSnapshot(s=>cb(s.exists?s.data():null,s.metadata),err),
    set:(p,d)=>run(p,()=>db.doc(p).set(d)),
    update:(p,d)=>run(p,()=>db.doc(p).update(d)),
    del:p=>run(p,()=>db.doc(p).delete()),
    add:(c,d)=>db.collection(c).add(d)
  };
}
function merge(a,b){const o={...a};for(const k in b){const v=b[k];o[k]=(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object")?merge(o[k],v):v}return o}
function mockApi(){
  const data={},subs=[];const fire=()=>subs.forEach(f=>f());
  const coll=c=>Object.entries(data).filter(([p])=>p.startsWith(c+"/")&&p.split("/").length===c.split("/").length+1).map(([p,v])=>({id:p.split("/").pop(),...v}));
  seedPreview(data);
  return{
    sub:(c,cb)=>{const f=()=>cb(coll(c),{fromCache:false});subs.push(f);setTimeout(f);return()=>{}},
    subDoc:(p,cb)=>{const f=()=>cb(data[p]?{...data[p]}:null,{fromCache:false});subs.push(f);setTimeout(f);return()=>{}},
    set:async(p,d)=>{data[p]=JSON.parse(JSON.stringify(d));fire()},
    update:async(p,d)=>{if(!data[p])throw{code:"invalid_argument"};data[p]=merge(data[p],d);fire()},
    del:async p=>{delete data[p];fire()},
    add:async(c,d)=>{const id="x"+Math.random().toString(36).slice(2,10);data[c+"/"+id]=JSON.parse(JSON.stringify(d));fire();return{id}}
  };
}
function seedPreview(data){
  const t=Date.now(),tk="2026-2";
  data["club/info"]={name:"우리 동아리 (예시)",term:"2026-2학기",fee:30000};
  const ms=[["김민준","회장","20210123","컴퓨터공학과",1],["이서연","부회장","20220456","산업디자인학과",1],["박지호","총무","20220789","경영학과",1],["최유나","회원","20230111","전자공학과",0],["정하준","회원","20240222","기계공학과",1],["강다은","회원","20240333","화학공학과",0]];
  ms.forEach((m,i)=>data["members/m"+i]={name:m[0],role:m[1],sid:m[2],dept:m[3],phone:"010-0000-000"+i,joined:"2026-03-0"+(i%9+1),createdAt:t});
  const amts=[30000,30000,30000,10000,30000,0],yn=["Y","Y","Y","N","Y","N"];
  ms.forEach((m,i)=>{data[`fees/${tk}/pay/m${i}`]={paid:yn[i],amount:amts[i],date:amts[i]?addDays(-20+i):"",updatedAt:t};
    if(amts[i])data[`ledger/fee_${tk}_m${i}`]={date:addDays(-20+i),type:"in",item:`2026-2학기 회비 · ${m[0]}`,amount:amts[i],memberId:"m"+i,term:tk,createdAt:t+i}});
  data["ledger/l1"]={date:addDays(-12),type:"out",item:"정기모임 다과",amount:42000,createdAt:t};
  data["ledger/l2"]={date:addDays(-5),type:"out",item:"동아리방 비품 (멀티탭)",amount:18500,createdAt:t};
  data["events/e1"]={title:"2학기 정기모임",date:addDays(-14),time:"18:30",place:"학생회관 302호",desc:"",att:{m0:"present",m1:"present",m2:"late",m3:"absent",m4:"present"},createdAt:t};
  data["events/e2"]={title:"신입회원 환영회",date:addDays(-3),time:"19:00",place:"학교 앞 식당",desc:"",att:{m0:"present",m1:"present",m2:"present",m4:"present",m5:"late"},createdAt:t};
  data["events/e3"]={title:"정기모임 · 학기 계획 발표",date:addDays(4),time:"18:30",place:"학생회관 302호",desc:"각 팀장은 발표 자료 준비",att:{},createdAt:t};
  data["events/e4"]={title:"MT",date:addDays(18),time:"10:00",place:"가평",desc:"참가비 별도",att:{},createdAt:t};
  data["notices/n1"]={title:"2학기 회비 납부 안내",cat:"중요",pinned:true,body:"이번 학기 회비는 30,000원입니다.\n총무(박지호)에게 이달 말까지 납부해 주세요.",createdAt:t-864e5*6};
  data["notices/n2"]={title:"MT 참가 신청 받습니다",cat:"행사",pinned:false,body:"일정 탭에서 날짜를 확인하고 단톡방에 참가 여부를 남겨 주세요.",createdAt:t-864e5*2};
}

/* write wrapper: surfaces errors in plain language */
async function w(p,scope){
  try{const r=await p;wroteOk=true;return r??true}
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"&&scope==="fee"&&S.mode==="live"){S.canFee=false;applyRO();toast("회비·장부는 소유자와 Editor만 수정할 수 있습니다.")}
    else if(c==="invalid_argument"&&!wroteOk&&S.mode==="live"){S.canWrite=false;applyRO();toast("이 페이지를 편집할 권한이 없어 읽기 전용으로 바꿨습니다.")}
    else if(c==="quota_exceeded")toast("저장 공간이 가득 찼습니다. 오래된 기록을 지운 뒤 다시 시도해 주세요.");
    else if(c==="revoked")toast("접근 권한이 바뀌어 저장할 수 없습니다.");
    else toast("저장하지 못했습니다. 잠시 후 다시 시도해 주세요.");
    return null;
  }
}
function applyRO(){document.body.classList.toggle("ro",!S.canWrite);document.body.classList.toggle("noadm",!S.canFee);renderAll()}

/* ---------- modal ---------- */
let onSubmit=null;
function openForm({title,fields,submit,okText="저장",danger=false,text=""}){
  const f=$("#mform");
  f.innerHTML=`<h3>${esc(title)}</h3>${text?`<p style="margin:0">${esc(text)}</p>`:""}`+
  fields.map(x=>{
    const id="f-"+x.id,v=x.value??"";
    if(x.type==="textarea")return`<div class="fld"><label for="${id}">${esc(x.label)}</label><textarea class="inp" id="${id}" ${x.required?"required":""}>${esc(v)}</textarea></div>`;
    if(x.type==="select")return`<div class="fld"><label for="${id}">${esc(x.label)}</label><select class="inp" id="${id}">${x.options.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
    if(x.type==="checkbox")return`<div class="fld chk"><input type="checkbox" id="${id}" ${v?"checked":""}><label for="${id}">${esc(x.label)}</label></div>`;
    return`<div class="fld"><label for="${id}">${esc(x.label)}</label><input class="inp" id="${id}" type="${x.type||"text"}" value="${esc(v)}" ${x.required?"required":""} ${x.placeholder?`placeholder="${esc(x.placeholder)}"`:""} ${x.type==="number"?'min="0" step="1" inputmode="numeric"':""}></div>`;
  }).join("")+
  `<div class="acts"><button type="button" class="btn" data-act="close">취소</button><button type="submit" class="btn pri" style="${danger?"background:var(--bad);border-color:var(--bad);color:#fff":""}">${esc(okText)}</button></div>`;
  onSubmit=async()=>{
    const vals={};
    for(const x of fields){const el=$("#f-"+x.id);vals[x.id]=x.type==="checkbox"?el.checked:x.type==="number"?Number(el.value)||0:el.value.trim();
      if(x.required&&!vals[x.id]){el.focus();toast(`'${x.label}'을(를) 입력해 주세요.`);return}}
    const btn=f.querySelector("[type=submit]");btn.disabled=true;
    const ok=await submit(vals);btn.disabled=false;
    if(ok!==false)closeModal();
  };
  $("#modal").hidden=false;
  const first=f.querySelector("input,textarea,select");(first||f.querySelector("[type=submit]")).focus();
}
function confirmBox(title,text,fn){openForm({title,text,fields:[],okText:"삭제",danger:true,submit:fn})}
function closeModal(){$("#modal").hidden=true;$("#mform").innerHTML="";onSubmit=null}
$("#mform").addEventListener("submit",e=>{e.preventDefault();onSubmit&&onSubmit()});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)closeModal()});

/* ---------- derived ---------- */
function attStats(mid){
  const past=S.events.filter(e=>e.date<=today()&&e.att&&e.att[mid]);
  if(!past.length)return null;
  const ok=past.filter(e=>e.att[mid]==="present"||e.att[mid]==="late").length;
  return{ok,n:past.length,pct:Math.round(ok/past.length*100)};
}
function evCount(e){const a=e.att||{};const ids=new Set(S.members.map(m=>m.id));let p=0,l=0,x=0;for(const k in a){if(!ids.has(k))continue;if(a[k]==="present")p++;else if(a[k]==="late")l++;else if(a[k]==="absent")x++}return{p,l,x}}
/* 회비 로직: paid(Y/N)는 관리자가 직접 정하는 값, amount는 실제 받은 금액.
   Y = 이번 학기 회비 처리 끝(금액이 적어도 할인·조정으로 인정) / N = 남은 금액(회비-받은 금액)이 미수금 */
const feeDue=()=>Number(S.info.fee)||0;
function feeOf(mid){
  const r=S.fees[mid];if(r)return{paid:r.paid==="Y"?"Y":"N",amount:Number(r.amount)||0,date:r.date||""};
  const m=find(S.members,mid),tk=termKey();
  if(m&&m.paid&&m.paid[tk])return{paid:"Y",amount:feeDue(),date:""}; // 이전 버전 데이터 호환
  return{paid:"N",amount:0,date:""};
}
function feeState(f){const due=feeDue();
  if(f.paid==="Y")return f.amount>=due?{k:"ok",t:"납부"}:{k:"ok",t:f.amount?"납부(조정)":"납부(금액 0)"};
  return f.amount>=due&&due>0?{k:"warn",t:"N · 전액 받음"}:f.amount>0?{k:"warn",t:"부분납"}:{k:"bad",t:"미납"}}
const owed=f=>f.paid==="Y"?0:Math.max(0,feeDue()-f.amount);
function feeStats(){const act=activeMembers();let paid=0,got=0,left=0;
  for(const m of act){const f=feeOf(m.id);if(f.paid==="Y")paid++;got+=f.amount;left+=owed(f)}
  return{paid,total:act.length,pct:act.length?Math.round(paid/act.length*100):0,got,left}}
function balance(){let i=0,o=0;for(const l of S.ledger){if(l.type==="out")o+=Number(l.amount)||0;else i+=Number(l.amount)||0}return{i,o,b:i-o}}
const sortedNotices=()=>[...S.notices].sort((a,b)=>(!!b.pinned-!!a.pinned)||((b.createdAt||0)-(a.createdAt||0)));
const upcoming=()=>S.events.filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const pastEvents=()=>S.events.filter(e=>e.date<today()).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
const catChip=c=>`<span class="chip ${c==="중요"?"bad":c==="행사"?"acc":c==="모집"?"warn":""}">${esc(c||"일반")}</span>`;
const roleChip=r=>`<span class="chip ${["회장","부회장","총무","운영진"].includes(r)?"acc":r==="휴면"?"":"ok"}">${esc(r||"회원")}</span>`;
const fmtTime=t=>{const d=new Date(t||0);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const author=n=>n.author?(S.names[n.author]||""):"";

/* ---------- views ---------- */
function noticeCard(n,compact){
  const a=author(n);
  return`<article class="card notice ${n.pinned?"pinned":""}">
    <div class="meta">${n.pinned?'<span class="chip acc">고정</span>':""}${catChip(n.cat)}<span>${fmtTime(n.createdAt)}</span>${a?`<span>· ${esc(a)}</span>`:""}</div>
    <h3>${esc(n.title)}</h3>
    <div class="body ${compact?"muted":""}">${esc(compact&&n.body&&n.body.length>90?n.body.slice(0,90)+"…":n.body)}</div>
    ${compact?"":`<div class="row-actions w"><button class="btn ghost sm" data-act="notice-pin" data-id="${esc(n.id)}">${n.pinned?"고정 해제":"상단 고정"}</button><button class="btn ghost sm" data-act="notice-edit" data-id="${esc(n.id)}">수정</button><button class="btn ghost sm danger" data-act="notice-del" data-id="${esc(n.id)}">삭제</button></div>`}
  </article>`;
}
function dateBlock(s){const d=parseD(s);return`<div class="date"><div class="m">${d.getMonth()+1}월</div><div class="d">${d.getDate()}</div><div class="w">${WD[d.getDay()]}요일</div></div>`}
function eventCard(e,compact){
  const c=evCount(e),past=e.date<today(),open=S.openEvent===e.id&&!compact;
  const tot=activeMembers().length;
  const att=(c.p+c.l+c.x)?`<span class="chip ok">출석 ${c.p+c.l}/${tot}</span>${c.l?`<span class="chip warn">지각 ${c.l}</span>`:""}${c.x?`<span class="chip bad">결석 ${c.x}</span>`:""}`:(past?'<span class="chip">출석 미기록</span>':`<span class="chip acc">${dday(e.date)}</span>`);
  return`<article class="card ev ${past?"past":""}">
    ${dateBlock(e.date)}
    <div class="ev-main"><h3>${esc(e.title)}</h3>
      <div class="meta">${e.time?`<span>${esc(e.time)}</span>`:""}${e.place?`<span>· ${esc(e.place)}</span>`:""}</div>
      ${e.desc&&!compact?`<div class="muted" style="font-size:14px;white-space:pre-wrap">${esc(e.desc)}</div>`:""}
      <div class="meta" style="margin-top:4px">${att}</div>
    </div>
    ${compact?"":`<div class="row-actions"><button class="btn sm ${open?"pri":""}" data-act="event-open" data-id="${esc(e.id)}" aria-expanded="${open}">${open?"출석부 닫기":"출석 체크"}</button><button class="btn ghost sm w" data-act="event-edit" data-id="${esc(e.id)}">수정</button><button class="btn ghost sm danger w" data-act="event-del" data-id="${esc(e.id)}">삭제</button></div>`}
    ${open?attPanel(e):""}
  </article>`;
}
function attPanel(e){
  const ms=[...activeMembers()].sort((a,b)=>roleOrder(a.role)-roleOrder(b.role)||byName(a,b));
  if(!ms.length)return`<div class="att"><div class="muted">회원 명단에 회원을 먼저 추가해 주세요.</div></div>`;
  const a=e.att||{},dis=S.canWrite?"":"disabled";
  return`<div class="att">${S.canWrite?`<div class="meta"><span>버튼을 눌러 기록하고, 한 번 더 누르면 지워집니다.</span><span class="spacer"></span><button class="btn sm" data-act="att-all" data-eid="${esc(e.id)}">미기록 전원 출석</button></div>`:""}
    ${ms.map(m=>`<div class="att-row"><span class="nm">${esc(m.name)}</span><span class="seg" role="group" aria-label="${esc(m.name)} 출석">
      ${[["present","출석"],["late","지각"],["absent","결석"]].map(([k,l])=>`<button ${dis} class="${k} ${a[m.id]===k?"on":""}" aria-pressed="${a[m.id]===k}" data-act="att" data-eid="${esc(e.id)}" data-mid="${esc(m.id)}" data-st="${k}">${l}</button>`).join("")}
    </span></div>`).join("")}</div>`;
}

  {id:"time",label:"시간",type:"time",value:e?.time||"18:30"},{id:"place",label:"장소",value:e?.place,placeholder:"예: 학생회관 302호"},
  {id:"desc",label:"메모",type:"textarea",value:e?.desc}],
  submit:async v=>e?!!await w(api.update("events/"+e.id,v)):!!await w(api.add("events",{...v,att:{},createdAt:Date.now()}))})}
function memberForm(m){openForm({title:m?"회원 정보 수정":"회원 추가",fields:[
  {id:"name",label:"이름",value:m?.name,required:true},{id:"role",label:"역할",type:"select",options:ROLES,value:m?.role||"회원"},
  {id:"sid",label:"학번",value:m?.sid,placeholder:"예: 20260123"},{id:"dept",label:"학과",value:m?.dept},
  {id:"phone",label:"연락처",type:"tel",value:m?.phone,placeholder:"010-0000-0000"},{id:"joined",label:"가입일",type:"date",value:m?.joined||today()}],
  submit:async v=>m?!!await w(api.update("members/"+m.id,v)):!!await w(api.add("members",{...v,paid:{},createdAt:Date.now()}))})}
function settingsForm(){openForm({title:"동아리 설정",fields:[
  {id:"name",label:"동아리 이름",value:S.info.name,required:true},{id:"term",label:"현재 학기",value:S.info.term,required:true,placeholder:"예: 2026-2학기"},
  {id:"fee",label:"1인당 회비 (원)",type:"number",value:S.info.fee}],
  submit:async v=>{if(!/[A-Za-z0-9]/.test(v.term)){toast("학기에는 숫자를 포함해 주세요. 예: 2026-2학기");return false}return !!await w(api.set("club/info",v),"fee")}})}
async function saveFee(mid,patch){
  const m=find(S.members,mid);if(!m)return;
  const tk=termKey(),cur=feeOf(mid),due=feeDue();
  const next={paid:cur.paid,amount:cur.amount,date:cur.date,...patch};
  next.amount=Math.max(0,Math.round(Number(next.amount)||0));
  if(patch.amount!==undefined&&patch.paid===undefined){      // 금액만 바꾼 경우의 자동 판정
    if(next.amount>=due&&due>0)next.paid="Y"; else if(next.amount===0)next.paid="N";
  }
  if(next.amount>0&&(!cur.date||patch.amount!==undefined))next.date=today();
  if(next.amount===0)next.date="";
  if(next.paid===cur.paid&&next.amount===cur.amount&&S.fees[mid])return;
  if(!await w(api.set(`fees/${tk}/pay/${mid}`,{paid:next.paid,amount:next.amount,date:next.date,updatedAt:Date.now()}),"fee"))return renderFees();
  const lp=`ledger/fee_${tk}_${mid}`;
  if(next.amount>0)await w(api.set(lp,{date:next.date||today(),type:"in",item:`${S.info.term} 회비 · ${m.name}`,amount:next.amount,memberId:mid,term:tk,createdAt:Date.now()}),"fee");
  else if(cur.amount>0)await w(api.del(lp),"fee");
}
function ledgerForm(type){openForm({title:type==="out"?"지출 기록":"수입 기록",fields:[
  {id:"date",label:"날짜",type:"date",value:today(),required:true},{id:"item",label:"내용",value:"",required:true,placeholder:type==="out"?"예: 정기모임 다과":"예: 학과 지원금"},
  {id:"amount",label:"금액 (원)",type:"number",value:"",required:true}],
  submit:async v=>!!await w(api.add("ledger",{...v,type,createdAt:Date.now()}),"fee")})}

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="close")return closeModal();
  if(!api)return;
  switch(a){
    case"settings":return settingsForm();
    case"notice-new":return noticeForm();
    case"notice-edit":return noticeForm(find(S.notices,id));
    case"notice-pin":{const n=find(S.notices,id);return w(api.update("notices/"+id,{pinned:!n.pinned}))}
    case"notice-del":{const n=find(S.notices,id);return confirmBox("공지 삭제",`'${n.title}' 공지를 삭제할까요?`,async()=>!!await w(api.del("notices/"+id)))}
    case"event-new":return eventForm();
    case"event-edit":return eventForm(find(S.events,id));
    case"event-del":{const e=find(S.events,id);return confirmBox("일정 삭제",`'${e.title}' 일정과 출석 기록을 삭제할까요?`,async()=>!!await w(api.del("events/"+id)))}
    case"event-open":S.openEvent=S.openEvent===id?null:id;return renderEvents();
    case"att":{const e=find(S.events,b.dataset.eid),cur=e.att&&e.att[b.dataset.mid];return w(api.update("events/"+e.id,{att:{[b.dataset.mid]:cur===b.dataset.st?"":b.dataset.st}}))}
    case"att-all":{const e=find(S.events,b.dataset.eid),a2={};activeMembers().forEach(m=>{if(!(e.att&&e.att[m.id]))a2[m.id]="present"});if(!Object.keys(a2).length)return toast("모든 회원이 이미 기록되어 있습니다.");return w(api.update("events/"+e.id,{att:a2}))}
    case"member-new":return memberForm();
    case"member-edit":return memberForm(find(S.members,id));
    case"member-del":{const m=find(S.members,id);return confirmBox("회원 삭제",`${m.name} 회원을 명단에서 삭제할까요? 이미 기록된 회비 장부는 남습니다.`,async()=>!!await w(api.del("members/"+id)))}
    case"fee-yn":return saveFee(id,{paid:b.dataset.v});
    case"fee-full":return saveFee(id,{paid:"Y",amount:feeDue()});
    case"ledger-new":return ledgerForm(b.dataset.type);
    case"ledger-del":{const l=find(S.ledger,id);return confirmBox("장부 기록 삭제",`'${l.item}' (${won(l.amount)}) 기록을 삭제할까요?`,async()=>!!await w(api.del("ledger/"+id),"fee"))}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="m-q"){S.mq=e.target.value;renderMemberList()}});
document.addEventListener("change",e=>{if(e.target.id==="m-role"){S.mrole=e.target.value;renderMemberList()}
  if(e.target.classList.contains("fee-amt")&&api){const v=e.target.value.trim();if(v!==""&&!(Number(v)>=0)){toast("금액은 0 이상의 숫자로 입력해 주세요.");return renderFees()}saveFee(e.target.dataset.id,{amount:Number(v)||0})}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("fee-amt"))e.target.blur()});

/* ---------- names for notice authors ---------- */
async function resolveNames(){
  if(!userCap||!userCap.profiles)return;
  const ids=[...new Set(S.notices.map(n=>n.author).filter(x=>x&&!(x in S.names)))];if(!ids.length)return;
  try{const ps=await userCap.profiles(ids);ids.forEach(i=>S.names[i]=(ps&&ps[i]&&ps[i].name)||"");renderNotices();renderHome()}catch(e){}
}

/* ---------- boot ---------- */
function start(mode){
  S.mode=mode;
  const srcs=["info","notices","events","members","ledger","fees"],done=new Set();
  let feeTk=null,feeUnsub=null;
  const subFees=()=>{const tk=termKey();if(tk===feeTk)return;feeTk=tk;if(feeUnsub)feeUnsub();S.fees={};
    feeUnsub=api.sub(`fees/${tk}/pay`,(d,m)=>{const o={};d.forEach(x=>o[x.id]=x);S.fees=o;renderFees();renderHome();renderMemberList();got("fees",m)},fail)};
  const timer=setTimeout(()=>{if(done.size<srcs.length)banner("데이터를 아직 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.")},10000);
  const got=(k,meta)=>{if(!meta||!meta.fromCache){done.add(k);if(done.size===srcs.length){clearTimeout(timer);if(mode==="live")banner("")}}};
  const fail=e=>{clearTimeout(timer);banner(e&&e.code==="revoked"?"이 페이지의 데이터에 접근할 수 없습니다.":"데이터 연결이 끊겼습니다. 페이지를 다시 열어 주세요.")};
  api.subDoc("club/info",(d,m)=>{if(d)S.info={...S.info,...d};subFees();renderAll();got("info",m)},fail);
  subFees();
  api.sub("notices",(d,m)=>{S.notices=d;renderNotices();renderHome();got("notices",m);resolveNames()},fail);
  api.sub("events",(d,m)=>{S.events=d;renderEvents();renderHome();renderMembers();got("events",m)},fail);
  api.sub("members",(d,m)=>{S.members=d;renderAll();got("members",m)},fail);
  api.sub("ledger",(d,m)=>{S.ledger=d;renderFees();renderHome();got("ledger",m)},fail);
}
(async function init(){
  renderAll();route();
  let db=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,userCap]=await Promise.all([claude.use("db"),claude.use("user")])}catch(e){}
  }
  if(db){
    api=realApi(db);
    if(userCap){
      try{const c=await userCap.can("data.write");if(c===false){S.canWrite=false;document.body.classList.add("ro")}}catch(e){}
      try{const a=await userCap.canEdit();if(a===false){S.canFee=false;document.body.classList.add("noadm")}}catch(e){}
      try{S.me=await userCap.id()}catch(e){}
    }
    start("live");
  }else{
    api=mockApi();
    banner("미리보기 모드: 예시 데이터가 표시되며 변경 내용은 저장되지 않습니다.");
    start("preview");
  }
})();
</script>
